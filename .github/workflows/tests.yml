name: Tests

on:
  - push
  - pull_request

jobs:
  lint:
    name: lint / 3.12
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group dev --locked
      - name: Ruff lint
        run: uv run ruff check --no-fix .
      - name: Ruff format check
        run: uv run ruff format --check .

  tests:
    name: tests / 3.12
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "1"
      # Point the harness at the CI service containers (the conftest opt-in);
      # otherwise it would spin up its own testcontainers. Same shapes the
      # dev-compose opt-in uses locally.
      GNR_TEST_PG_URL: "postgresql+psycopg://gnr:gnrpass@localhost:5432/gnr"
      GNR_TEST_RABBIT_URL: "amqp://smqPublic:smqPublic@localhost:5672/d1__1"
      # Required (no default): the universe this registry instance serves.
      GNR_UNIVERSE: "d1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gnr
          POSTGRES_PASSWORD: gnrpass
          POSTGRES_DB: gnr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gnr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbit:
        # The same baked dev broker (vhost d1__1, smqPublic, gwbase.topology
        # exchanges) used everywhere else; the Layer-2 test also declares its own
        # exchanges from gwbase.topology, so a plain broker would work too.
        image: ghcr.io/thegridelectric/dev-rabbit:latest
        ports:
          - 5672:5672
          - 1885:1885
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --group dev --locked

      - name: Run tests (unit + integration)
        run: uv run pytest -q
