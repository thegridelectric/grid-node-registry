name: Image

# Build the registry image and push it to GHCR for linux/amd64 and
# linux/arm64. Each push to main publishes two tags: the full commit SHA,
# which is the one to pin, and `latest`.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "alembic/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/image.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/thegridelectric/grid-node-registry:latest
            ghcr.io/thegridelectric/grid-node-registry:${{ github.sha }}
