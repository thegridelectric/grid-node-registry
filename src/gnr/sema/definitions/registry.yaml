metadata:
  registry_version: "1.0"
  last_updated: "2026-08-06T14:35:00Z"
  maintainer: "gridworks-energy"

formats:
  left.right.dot:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/left.right.dot"
    created: "2022-01-01T00:00:00Z"
    status: "published"
    description: "Dot-separated hierarchical identifier composed of lowercase alphanumeric segments"

  utc.milliseconds:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/utc.milliseconds"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "UTC timestamp in whole milliseconds since Unix epoch (2000–3000 range)"

  uuid4.str:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/uuid4.str"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Canonical lowercase UUIDv4 string (RFC 4122) in 8-4-4-4-12 format"

enums:
  base.g.node.class:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Universal physical ontology classification for Grid Nodes"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/base.g.node.class/000"
        created: "2026-02-22T16:43:00Z"
        status: "published"

  g.node.status:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Lifecycle status of a Grid Node within the registry"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/g.node.status/000"
        created: "2026-02-22T16:43:00Z"
        status: "published"

types:
  connectivity.edge.gt:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Directed topological edge connecting two Grid Nodes in the physical electric network"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/connectivity.edge.gt/000"
        created: "2026-02-23T00:00:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "g.node.status:000"
            - "uuid4.str"

  g.node.cmd.ack:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "The Grid Node Registry's direct reply to a write command it applied; success vs refusal is discriminated by TypeName (twin: g.node.cmd.nack)."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/g.node.cmd.ack/000"
        created: "2026-07-21T14:30:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural: []

  g.node.cmd.nack:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "The Grid Node Registry's direct reply to a write command it refused, carrying the verbatim reason; success vs refusal is discriminated by TypeName (twin: g.node.cmd.ack)."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/g.node.cmd.nack/000"
        created: "2026-07-21T14:30:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural: []

  g.node.create.cmd:
    latest_version: "001"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Command to create a single GNode in the Grid Node Registry: the registrar-facing write by which a node enters the registry, one node per command, parents first."

    versions:
      "001":
        schema_url: "https://schemas.electricity.works/types/g.node.create.cmd/001"
        created: "2026-08-06T13:25:00Z"
        status: "published"
        summary: "- NewNode rebinds to g.node.gt:006; new axiom 1 LocationlessAtCreation (NewNode.PositionPointId SHALL be null — a location identity is registered after creation)"
        direct_dependencies:
          structural:
            - "g.node.gt:006"

  g.node.forest:
    latest_version: "002"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "A forest of Grid Node subtrees: the subtrees under one or more root aliases, carried as their current GNodes plus the connectivity edges wiring them together."

    versions:
      "002":
        schema_url: "https://schemas.electricity.works/types/g.node.forest/002"
        created: "2026-08-06T13:25:00Z"
        status: "published"
        summary: "- Nodes rebind to g.node.gt:006; SendTimeMs joins required"
        direct_dependencies:
          structural:
            - "connectivity.edge.gt:000"
            - "g.node.gt:006"
            - "left.right.dot"
            - "utc.milliseconds"

  g.node.forest.request:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "A read query for one or more Grid Node forests: the caller names root aliases and correlates the response by RequestId."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/g.node.forest.request/000"
        created: "2026-07-03T18:55:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "left.right.dot"
            - "uuid4.str"

  g.node.gt:
    latest_version: "006"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Fundamental identity object representing physical and logical grid nodes"

    versions:
      "006":
        schema_url: "https://schemas.electricity.works/types/g.node.gt/006"
        created: "2026-08-06T13:25:00Z"
        status: "published"
        summary: "- Axiom 2 (PhysicalGNodeLocations) becomes activation-conditioned: PositionPointId is mandatory only when Status is Active — a Pending physical GNode may be locationless"
        direct_dependencies:
          structural:
            - "base.g.node.class:000"
            - "g.node.status:000"
            - "left.right.dot"
            - "uuid4.str"

  g.node.reparent.cmd:
    latest_version: "002"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Command to re-parent a subtree in the Grid Node Registry: introduce a new node N and re-parent one or more children beneath it."

    versions:
      "002":
        schema_url: "https://schemas.electricity.works/types/g.node.reparent.cmd/002"
        created: "2026-08-06T13:25:00Z"
        status: "published"
        summary: "- NewNode rebinds to g.node.gt:006"
        direct_dependencies:
          structural:
            - "g.node.gt:006"
            - "uuid4.str"

  position.point.gt:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Geographic position expressed in integer microdegrees (WGS84)"

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/position.point.gt/000"
        created: "2026-02-24T15:00:00Z"
        status: "published"
        summary: "Initial Sema version"
        direct_dependencies:
          structural:
            - "uuid4.str"
