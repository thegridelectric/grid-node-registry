services:
  postgres:
    image: postgres:16
    container_name: gnr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gnr
      POSTGRES_PASSWORD: gnrpass
      POSTGRES_DB: gnr
    ports:
      # Host 5435 → container 5432. Not 5432: a host-local Postgres commonly
      # holds 127.0.0.1:5432 and macOS resolves localhost→::1 first, so a
      # 5432:5432 publish gets shadowed ("role gnr does not exist"). 5433/5434
      # are taken by sibling gridworks containers (gw-data-pg); 5435 is free.
      - "5435:5432"
    volumes:
      - gnr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gnr"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  gnr_pgdata:
    name: gnr_pgdata